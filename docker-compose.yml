# One-command local stack: docker compose up --build
# API: http://localhost:5000/api   (set JWT_SECRET in your shell or a root .env for anything beyond a local demo)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: project_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_management"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-localdev}@db:5432/project_management
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-me}
    ports:
      - "5000:5000"
volumes:
  pgdata:
